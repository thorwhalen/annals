# Traefik (v3) file-provider fragment: route https://<host>/tray/* to the tray service.
# Drop it in the dynamic-config directory Traefik watches; it is picked up live.
# The priority must beat the platform's catch-all and /api router so /tray/api/* lands here.
http:
  routers:
    tray:
      rule: "Host(`apps.example.com`) && PathPrefix(`/tray`)"
      entryPoints:
        - https
      service: tray
      priority: 40
      tls:
        certResolver: letsencrypt
  services:
    tray:
      loadBalancer:
        servers:
          - url: "http://127.0.0.1:8765"
